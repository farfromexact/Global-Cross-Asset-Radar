name: Validate Radar Reports

on:
  push:
    branches: [main]
    # Only the final manifest write gates reports; code/fixture changes also run.
    paths:
      - "manifests/reports.json"
      - "tests/**"
      - "config/archive-policy.json"
      - "schemas/**"
      - "scripts/**"
      - "prompts/**"
      - "templates/**"
      - "docs/SCHEDULE_ARCHIVE_INSTRUCTIONS.md"
      - ".github/workflows/validate-reports.yml"
  pull_request:
    paths:
      - "latest/**"
      - "reports/**"
      - "tests/**"
      - "manifests/**"
      - "status/**"
      - "config/archive-policy.json"
      - "schemas/**"
      - "scripts/**"
      - "prompts/**"
      - "templates/**"
      - "docs/SCHEDULE_ARCHIVE_INSTRUCTIONS.md"
      - ".github/workflows/validate-reports.yml"
  workflow_dispatch:
    inputs:
      strict_audit:
        description: "Also enforce the original strict schema and Markdown rules"
        type: boolean
        default: false

concurrency:
  group: validate-radar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report-health:
    name: Current report readability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check current reports (editorial drift is advisory)
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_report_health.py --base-ref "$BASE_REF" --output-json current-health.json
      - name: Retain current report findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-report-health
          path: current-health.json
          if-no-files-found: warn
          retention-days: 14

  archive-audit:
    name: Archive advice and validator tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"
      - name: Audit historical schema and Markdown (advisory)
        run: python scripts/check_report_health.py --scope audit --output-json archive-advice.json
      - name: Run validator regression tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Retain complete archive advice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-advice
          path: archive-advice.json
          if-no-files-found: warn
          retention-days: 14

  strict-audit:
    name: Optional strict audit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_audit }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"
      - run: python scripts/validate_reports.py --scope full
      - if: ${{ !cancelled() }}
        run: python scripts/validate_markdown_reports.py
