name: Validate Radar Reports

on:
  push:
    branches: [main]
    paths:
      - "latest/**"
      - "reports/**"
      - "tests/**"
      - "manifests/**"
      - "status/**"
      - "schemas/**"
      - "scripts/validate_reports.py"
      - ".github/workflows/validate-reports.yml"
  pull_request:
    paths:
      - "latest/**"
      - "reports/**"
      - "tests/**"
      - "manifests/**"
      - "status/**"
      - "schemas/**"
      - "scripts/validate_reports.py"
      - ".github/workflows/validate-reports.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validator
        run: python -m pip install "jsonschema[format]>=4.23"

      - name: Validate reports, manifest and portable citations
        run: python scripts/validate_reports.py
