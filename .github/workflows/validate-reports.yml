name: Validate Radar Reports

on:
  push:
    branches: [main]
    # Formal archives write six files directly to main. The manifest is written
    # last, so it is the single CI gate instead of starting one run per file.
    paths:
      - "manifests/reports.json"
      - "tests/**/*_morning.json"
      - "tests/**/*_evening.json"
      - "tests/test_*.py"
      - "config/archive-policy.json"
      - "schemas/**"
      - "scripts/validate_reports.py"
      - "scripts/validate_markdown_reports.py"
      - "prompts/**"
      - "templates/**"
      - "docs/SCHEDULE_ARCHIVE_INSTRUCTIONS.md"
      - ".github/workflows/validate-reports.yml"
  pull_request:
    paths:
      - "latest/**"
      - "reports/**"
      - "tests/**"
      - "manifests/**"
      - "status/**"
      - "config/archive-policy.json"
      - "prompts/**"
      - "templates/**"
      - "schemas/**"
      - "scripts/validate_reports.py"
      - "scripts/validate_markdown_reports.py"
      - ".github/workflows/validate-reports.yml"
  workflow_dispatch:

concurrency:
  group: validate-radar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publication:
    name: Validate current publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect manifest publication
        id: publication
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_REF" ]]; then
            echo "manifest_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          if [[ "$BASE_REF" =~ ^0+$ ]] || ! git cat-file -e "$BASE_REF^{commit}"; then
            echo "manifest_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_REF" "$GITHUB_SHA" -- | grep -Fxq "manifests/reports.json"; then
            echo "manifest_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.publication.outputs.manifest_changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator
        if: steps.publication.outputs.manifest_changed == 'true'
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"

      - name: Validate final six-file publication
        if: steps.publication.outputs.manifest_changed == 'true'
        env:
          BASE_REF: ${{ steps.publication.outputs.base_ref }}
        run: python scripts/validate_reports.py --scope publication --base-ref "$BASE_REF"

  full-archive:
    name: Validate full archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"

      - name: Validate reports, manifest and portable citations
        run: python scripts/validate_reports.py --scope full

      - name: Validate full Markdown archives
        run: python scripts/validate_markdown_reports.py

      - name: Run archive validator tests
        run: python -m unittest discover -s tests -p "test_*.py"
